[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nano-numpy"
version = "1.0.0"
description = "Nano: a reverse-mode autodiff engine, MLP and CNN stack in pure NumPy, verified against PyTorch to machine precision."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
# PyTorch is the oracle: used only by tests/ and experiments/, never imported by nano/.
dev = ["torch>=2.1", "pytest>=7", "matplotlib>=3.7", "jsonschema>=4", "scipy>=1.10", "ruff>=0.4"]

[tool.setuptools]
packages = ["nano", "evalkit"]

[tool.setuptools.package-data]
evalkit = ["results.schema.json"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q"
markers = ["slow: long-running checks, excluded from `make test-fast`"]

[tool.ruff]
line-length = 120
target-version = "py310"
extend-exclude = ["data", "report/_site"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E731", "B023", "B905"]

[tool.ruff.lint.per-file-ignores]
"nano/ops.py" = ["A001"]
# experiments import `experiments.common` before NumPy on purpose (it pins BLAS threads)
"experiments/*.py" = ["I001", "E501"]
