name: nightly
# Full parity suite nightly (PRD section 13): every test, then E1 parity (A3, A4) and the bug hunt (A7).
on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

jobs:
  parity:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: |
          python -m pip install --upgrade pip
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e ".[dev]"
      - run: make data
      - run: make test
      - run: make parity e4 e6
      - uses: actions/upload-artifact@v4
        with:
          name: nightly-results
          path: results/
